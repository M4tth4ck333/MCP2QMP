<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MCP2QMP - Pyodide Live Environment</title>
    <!-- Pyodide CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        textarea { width: 100%; height: 150px; background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 10px; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        pre { background: #2d2d2d; padding: 10px; border: 1px solid #444; }
    </style>
</head>
<body>
    <h1>🚀 MCP2QMP Live Sandbox (Pyodide / WebAssembly)</h1>
    <p>Hier läuft echter Python-Code direkt im Browser via WebAssembly:</p>

    <textarea id="code">
# Teste die Dunder-DSL im Browser:
class QMPPathProxy:
    def __init__(self, path="$"): self.path = path
    def __getattr__(self, name): return QMPPathProxy(f"{self.path}.{name}")
    def __getitem__(self, key): return QMPPathProxy(f"{self.path}[{key}]")
    def __repr__(self): return f"QueryPath({self.path})"

client_q = QMPPathProxy()
print("Dot Notation:", client_q.status.running)
print("Subscript:", client_q["status"]["running"])
print("Array Index:", client_q.cpus[0].pcpus[0])
    </textarea><br>
    <button onclick="runPython()">Code ausführen</button>

    <h3>Ausgabe:</h3>
    <pre id="output">Lade Pyodide...</pre>

    <script>
        let pyodide;
        async function main() {
            pyodide = await loadPyodide();
            document.getElementById("output").innerText = "Pyodide bereit! Klicke auf 'Code ausführen'.";
        }
        main();

        async function runPython() {
            document.getElementById("output").innerText = "Führe aus...";
            let code = document.getElementById("code").value;
            try {
                // Umleitung von stdout für print() Befehle
                pyodide.runPython(`
                    import sys
                    import io
                    sys.stdout = io.StringIO()
                `);
                await pyodide.runPythonAsync(code);
                let stdout = pyodide.runPython("sys.stdout.getvalue()");
                document.getElementById("output").innerText = stdout;
            } catch (err) {
                document.getElementById("output").innerText = err;
            }
        }
    </script>
</body>
</html>
