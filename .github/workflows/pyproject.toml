[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp2qmp"
version = "1.0.0"
description = "Bridging Model Context Protocol (MCP) with QEMU Monitor Protocol (QMP) via a Python-native Dunder-DSL."
readme = "README.md"
authors = [
    { name = "M4tth4ck333" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/M4tth4ck333/MCP2QMP"

[tool.setuptools.packages.find]
where = ["."]
include = ["MCP2QMP*"]
